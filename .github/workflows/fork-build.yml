name: Fork Build Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KEY_ALIAS: soundman-ci
      KEYSTORE_PASSWORD: android
      KEY_PASSWORD: android

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/commandlinetools.zip"
          tools_url="https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          tools_sha256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"

          curl --fail --location --silent --show-error "$tools_url" -o "$tools_zip"
          echo "$tools_sha256  $tools_zip" | sha256sum --check --strict

          mkdir -p "$sdk_root/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline"
          unzip -q "$tools_zip" -d "$RUNNER_TEMP/android-cmdline"
          mv "$RUNNER_TEMP/android-cmdline/cmdline-tools/"* "$sdk_root/cmdline-tools/latest/"

          export ANDROID_SDK_ROOT="$sdk_root"
          export ANDROID_HOME="$sdk_root"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"

          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/soundman-ci.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=SoundMan CI, O=Fork Build, C=CN"
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "androidStoreFile=$RUNNER_TEMP/soundman-ci.jks"
          } > local.properties

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace -PbuildSuffix=fork-ci

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SoundMan-debug-${{ github.run_number }}
          path: app/build/outputs/renamed-apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
