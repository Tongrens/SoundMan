name: Fork Build Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KEY_ALIAS: soundman-ci
      KEYSTORE_PASSWORD: android
      KEY_PASSWORD: android

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Create temporary CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/soundman-ci.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=SoundMan CI, O=Fork Build, C=CN"
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            echo "androidStoreFile=$RUNNER_TEMP/soundman-ci.jks"
          } > local.properties

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace -PbuildSuffix=fork-ci

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SoundMan-debug-${{ github.run_number }}
          path: app/build/outputs/renamed-apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
